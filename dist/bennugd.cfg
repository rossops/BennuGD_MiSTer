# /media/fat/bennugd/bennugd.cfg: read when Main_MiSTer hands off to the
# BennuGD core. key=value, one per line. See hps/frontend/main.c.
game=/media/fat/games/BennuGD/SORRv52/SorR.dat
audio=default
# profiling session: uncomment, play, then tools/profsym.py hps/out/bennugd prof.bin on the Mac.
# Leave it off otherwise: the sampler's timer signal makes the audio stutter.
#prof=/media/fat/bennugd/prof.bin
# core options (defaults are fine for SorR):
#opt.bennugd_force_frame_limiter=true
# on-screen counter, top right: frames/s and the slowest frame (ms) of the last second
#fps=1
# page-cache pre-read of the game file, MB/s: default 4 from the card, 16 from a network share; 0 disables
#preread=16
